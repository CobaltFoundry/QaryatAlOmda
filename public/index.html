<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F2A2B">
<title>العمدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-tab="home">
<div id="app">
  <header class="top">
    <div class="who">
      <div class="avatar" aria-hidden="true">ع</div>
      <div class="who-text"><b id="whoName">عمدة</b><small id="whoLevel"></small></div>
    </div>
    <div class="top-end">
      <button id="helpBtn" class="help" aria-label="شرح اللعبة">؟</button>
      <div class="chip" title="نجوم التوريث">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#E8B23A" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></svg>
        <span id="starsChip">٠ نجمة</span>
      </div>
    </div>
  </header>

  <section class="balance" aria-live="polite">
    <small>رصيدك</small>
    <div id="cash" class="cash">٠</div>
    <div id="cps" class="cps">جنيه</div>
    <div id="boostBadge" class="boost" hidden></div>
  </section>

  <main>
    <section data-tab="home">
      <div id="offline" class="card offline" hidden>
        <span id="offlineText"></span>
        <button id="offlineOk" class="btn">تمام</button>
      </div>

      <div class="tap-zone" id="tapZone">
        <div class="tap-ring">
          <button id="tapBtn" class="tap-btn" aria-label="دوس تجيب فلوس">
            <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
              <path d="M30 92 L40 38 Q60 28 80 38 L90 92 Z" fill="#B3261E"/>
              <rect x="26" y="88" width="68" height="12" rx="4" fill="#7A1713"/>
              <path d="M60 33 Q76 28 82 46" stroke="#0F2A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
              <circle cx="83" cy="52" r="5" fill="#0F2A2B"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="bubble" class="bubble" aria-live="polite"></div>
      <div id="tapInfo" class="tap-info"></div>

      <div class="actions">
        <button id="boostBtn" class="card action">
          <b>ضاعف دخلك ×٢</b>
          <small id="boostSub">نص ساعة دخل مضاعف</small>
        </button>
        <button id="inviteBtn" class="card action">
          <b>ادعُ صاحبك</b>
          <small>انت وهو تاخدوا ساعة مضاعفة</small>
        </button>
      </div>
      <small id="ver" class="ver"></small>
    </section>

    <section data-tab="shop" hidden>
      <div class="qty" id="qty" role="group" aria-label="كمية الشراء">
        <button data-qty="1" class="on">×١</button>
        <button data-qty="10">×١٠</button>
        <button data-qty="max">أقصى</button>
      </div>
      <div class="chips" id="cats"></div>
      <div class="list" id="shopList"></div>
    </section>

    <section data-tab="upgrades" hidden>
      <div class="list" id="upList"></div>
    </section>

    <section data-tab="prestige" hidden>
      <div class="card prestige">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="#E8B23A" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></svg>
        <h2>العمدة كبر والولد جه يحكم</h2>
        <p id="prestigeText"></p>
        <div class="bar" aria-hidden="true"><i id="prestigeBar"></i></div>
        <button id="prestigeBtn" class="btn big">ورّث</button>
      </div>
      <h3 class="section-title">بركات الأبناء</h3>
      <div class="list" id="blessList"></div>
    </section>

    <section data-tab="rank" hidden>
      <div class="list" id="rankList"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="التنقل">
    <button data-go="home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
    <button data-go="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>المتجر</button>
    <button data-go="upgrades"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M5 12l7-7 7 7"/></svg>الترقيات</button>
    <button data-go="prestige"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></svg>التوريث</button>
    <button data-go="rank"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>الترتيب</button>
  </nav>
</div>
<div id="intro" class="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <div class="intro-card">
    <div id="introIcon" class="intro-icon" aria-hidden="true"></div>
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
    <div id="introDots" class="dots" aria-hidden="true"></div>
    <button id="introNext" class="btn big">التالي</button>
    <button id="introSkip" class="skip">تخطي</button>
  </div>
</div>
<div id="toast" role="status"></div>
<div id="fatal" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
